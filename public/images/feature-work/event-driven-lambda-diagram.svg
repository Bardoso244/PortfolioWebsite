<svg width="100%" viewBox="0 0 1000 680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Event-Driven Lambda Pipeline</title>
<desc>S3 Upload → SQS Buffer → Lambda Receiver → DynamoDB Results Store → DynamoDB Streams → Lambda Worker. Lambda Receiver and DLQ both publish to SNS Topic.</desc>
<style>
  text { font-family: 'Segoe UI', Inter, Arial, sans-serif; }
  .th       { font-size:13px; font-weight:600; fill:#111111; }
  .ts       { font-size:11px; fill:#333333; }
  .title    { font-size:20px; font-weight:700; fill:#ffffff; }
  .subtitle { font-size:13px; fill:#aaaaaa; }
  .footer   { font-size:12px; fill:#aaaaaa; }
  .label    { font-size:11px; fill:#aaaaaa; }
  .albl     { font-size:11px; fill:#aaaaaa; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#e53935" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#42a5f5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Background -->
<rect width="1000" height="680" fill="#000000" rx="16"/>

<!-- Header -->
<text class="title" x="44" y="42">Event-Driven Lambda Pipeline</text>
<text class="subtitle" x="44" y="66">S3 · SQS · Lambda · DynamoDB Streams · SNS · DLQ</text>

<!-- AWS Cloud boundary -->
<rect x="24" y="80" width="952" height="562" rx="12" fill="none" stroke="#2a3a4a" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="34" y="72" width="72" height="16" rx="4" fill="#000000"/>
<text class="label" x="42" y="84">AWS Cloud</text>

<!-- ═══════════════════════════════
     ROW 1 — centres: 112, 300, 488, 676
     ═══════════════════════════════ -->

<!-- S3 Upload (centre 112) -->
<rect x="42"  y="106" width="140" height="158" rx="10" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="0.8"/>
<rect x="62"  y="122" width="100" height="88"  rx="8"  fill="#2e7d32"/>
<ellipse cx="112" cy="138" rx="30" ry="10" fill="#fff" opacity="0.9"/>
<rect x="82" y="138" width="60" height="40" fill="#fff" opacity="0.75"/>
<ellipse cx="112" cy="178" rx="30" ry="10" fill="#fff" opacity="0.9"/>
<line x1="92"  y1="150" x2="132" y2="150" stroke="#2e7d32" stroke-width="1.2" opacity="0.5"/>
<line x1="92"  y1="162" x2="132" y2="162" stroke="#2e7d32" stroke-width="1.2" opacity="0.5"/>
<text class="th" x="112" y="222" text-anchor="middle">S3 Upload</text>
<text class="ts" x="112" y="240" text-anchor="middle">Input / Trigger</text>

<!-- Arrow S3 → SQS -->
<line x1="184" y1="185" x2="226" y2="185" stroke="#EF9F27" stroke-width="1.8" marker-end="url(#arr)"/>
<text class="albl" x="205" y="175" text-anchor="middle">Event</text>

<!-- SQS Buffer (centre 300) -->
<rect x="230" y="106" width="140" height="158" rx="10" fill="#fbeaf0" stroke="#f4c0d1" stroke-width="0.8"/>
<rect x="250" y="122" width="100" height="88"  rx="8"  fill="#ad1457"/>
<rect x="263" y="136" width="74" height="14" rx="4" fill="#fff" opacity="0.9"/>
<rect x="263" y="157" width="74" height="14" rx="4" fill="#fff" opacity="0.9"/>
<rect x="263" y="178" width="74" height="14" rx="4" fill="#fff" opacity="0.9"/>
<circle cx="272" cy="143" r="3.5" fill="#f48fb1"/>
<circle cx="272" cy="164" r="3.5" fill="#f48fb1"/>
<circle cx="272" cy="185" r="3.5" fill="#f48fb1"/>
<text class="th" x="300" y="222" text-anchor="middle">SQS Buffer</text>
<text class="ts" x="300" y="240" text-anchor="middle">Async queue</text>

<!-- Arrow SQS → Lambda Receiver -->
<line x1="372" y1="185" x2="414" y2="185" stroke="#EF9F27" stroke-width="1.8" marker-end="url(#arr)"/>
<text class="albl" x="393" y="175" text-anchor="middle">Trigger</text>

<!-- Lambda Receiver (centre 488) -->
<rect x="418" y="106" width="140" height="158" rx="10" fill="#fff8e1" stroke="#ffcc80" stroke-width="0.8"/>
<rect x="438" y="122" width="100" height="88"  rx="8"  fill="#e65100"/>
<polygon points="488,130 461,200 515,200" fill="#fff" opacity="0.15"/>
<polygon points="488,134 464,196 488,182" fill="#fff" opacity="0.95"/>
<polygon points="488,134 512,196 488,182" fill="#fff" opacity="0.7"/>
<text class="th" x="488" y="222" text-anchor="middle">Lambda</text>
<text class="ts" x="488" y="240" text-anchor="middle">Receiver</text>

<!-- Arrow Lambda Receiver → DynamoDB -->
<line x1="560" y1="185" x2="602" y2="185" stroke="#EF9F27" stroke-width="1.8" marker-end="url(#arr)"/>
<text class="albl" x="581" y="175" text-anchor="middle">Write</text>

<!-- DynamoDB Results Store (centre 676) -->
<rect x="606" y="106" width="140" height="158" rx="10" fill="#e3f0fd" stroke="#90c3f5" stroke-width="0.8"/>
<rect x="626" y="122" width="100" height="88"  rx="8"  fill="#1565c0"/>
<rect x="636" y="131" width="80" height="14" rx="3" fill="#fff" opacity="0.9"/>
<rect x="636" y="150" width="80" height="12" rx="2" fill="#fff" opacity="0.65"/>
<rect x="636" y="167" width="80" height="12" rx="2" fill="#fff" opacity="0.45"/>
<rect x="636" y="184" width="80" height="12" rx="2" fill="#fff" opacity="0.3"/>
<line x1="674" y1="131" x2="674" y2="196" stroke="#0d47a1" stroke-width="1" opacity="0.45"/>
<text class="th" x="676" y="222" text-anchor="middle">DynamoDB</text>
<text class="ts" x="676" y="240" text-anchor="middle">Results store</text>

<!-- Arrow DynamoDB → DynamoDB Streams (down) -->
<line x1="676" y1="266" x2="676" y2="352" stroke="#42a5f5" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrBlue)"/>
<text class="albl" x="704" y="314" text-anchor="middle">Streams</text>

<!-- ═══════════════════════════════
     ROW 2 — centres: 112 (SNS), 300 (DLQ), 488 (Lambda Worker), 676 (DDB Streams)
     ═══════════════════════════════ -->

<!-- SNS Topic (centre 112) -->
<rect x="42"  y="356" width="140" height="158" rx="10" fill="#fce4ec" stroke="#f48fb1" stroke-width="0.8"/>
<rect x="62"  y="372" width="100" height="88"  rx="8"  fill="#880e4f"/>
<rect x="72"  y="384" width="80" height="54" rx="5" fill="#fff" opacity="0.9"/>
<path d="M72 384 L112 410 L152 384" fill="none" stroke="#880e4f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="th" x="112" y="472" text-anchor="middle">SNS Topic</text>
<text class="ts" x="112" y="491" text-anchor="middle">Notification</text>

<!-- DLQ (centre 300) -->
<rect x="230" y="356" width="140" height="158" rx="10" fill="#ffebee" stroke="#ef9a9a" stroke-width="0.8"/>
<rect x="250" y="372" width="100" height="88"  rx="8"  fill="#b71c1c"/>
<rect x="263" y="386" width="74" height="13" rx="4" fill="#fff" opacity="0.9"/>
<rect x="263" y="406" width="74" height="13" rx="4" fill="#fff" opacity="0.9"/>
<rect x="263" y="426" width="74" height="13" rx="4" fill="#fff" opacity="0.9"/>
<line x1="272" y1="382" x2="285" y2="395" stroke="#ef9a9a" stroke-width="2" stroke-linecap="round"/>
<line x1="285" y1="382" x2="272" y2="395" stroke="#ef9a9a" stroke-width="2" stroke-linecap="round"/>
<text class="th" x="300" y="472" text-anchor="middle">DLQ</text>
<text class="ts" x="300" y="491" text-anchor="middle">Dead letter queue</text>

<!-- Lambda Worker (centre 488) -->
<rect x="418" y="356" width="140" height="158" rx="10" fill="#fff8e1" stroke="#ffcc80" stroke-width="0.8"/>
<rect x="438" y="372" width="100" height="88"  rx="8"  fill="#e65100"/>
<polygon points="488,380 461,450 515,450" fill="#fff" opacity="0.15"/>
<polygon points="488,384 464,446 488,432" fill="#fff" opacity="0.95"/>
<polygon points="488,384 512,446 488,432" fill="#fff" opacity="0.7"/>
<text class="th" x="488" y="472" text-anchor="middle">Lambda</text>
<text class="ts" x="488" y="491" text-anchor="middle">Worker</text>

<!-- DynamoDB Streams (centre 676) -->
<rect x="606" y="356" width="140" height="158" rx="10" fill="#e3f0fd" stroke="#90c3f5" stroke-width="0.8"/>
<rect x="626" y="372" width="100" height="88"  rx="8"  fill="#0d47a1"/>
<rect x="636" y="381" width="80" height="12" rx="3" fill="#fff" opacity="0.85"/>
<rect x="636" y="398" width="80" height="12" rx="3" fill="#fff" opacity="0.65"/>
<rect x="636" y="415" width="80" height="12" rx="3" fill="#fff" opacity="0.45"/>
<polygon points="680,378 672,396 678,396 670,414 688,393 681,393" fill="#42a5f5" opacity="0.9"/>
<text class="th" x="676" y="472" text-anchor="middle">DynamoDB</text>
<text class="ts" x="676" y="491" text-anchor="middle">Streams</text>

<!-- ═══════════════════════════════
     CONNECTIONS
     ═══════════════════════════════ -->

<!-- DynamoDB Streams → Lambda Worker -->
<line x1="604" y1="435" x2="562" y2="435" stroke="#42a5f5" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrBlue)"/>
<text class="albl" x="583" y="424" text-anchor="middle">Invoke</text>

<!-- Lambda Receiver → SNS Topic (diagonal down-left) -->
<path d="M452 264 Q282 310 182 372" fill="none" stroke="#EF9F27" stroke-width="1.8" marker-end="url(#arr)"/>
<!-- "Publish" label sits ON the orange diagonal arrow, midpoint ~(320,318) -->
<rect x="294" y="306" width="50" height="16" rx="3" fill="#000000"/>
<text class="albl" x="400" y="300" text-anchor="middle">Publish</text>

<!-- DLQ → SNS Topic — horizontal arrow from left edge of DLQ to right edge of SNS -->
<line x1="228" y1="435" x2="184" y2="435" stroke="#e53935" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
<!-- "Notify" label above the horizontal arrow -->
<rect x="182" y="420" width="46" height="14" rx="3" fill="#000000"/>
<text class="albl" x="205" y="431" text-anchor="middle">Notify</text>

<!-- DLQ retry loop back up to SQS -->
<path d="M300 354 Q300 294 300 266" fill="none" stroke="#e53935" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
<!-- "Retry" label ON the red vertical arrow, well away from the orange area -->
<rect x="306" y="326" width="38" height="16" rx="3" fill="#000000"/>
<text class="albl" x="325" y="338" text-anchor="middle">Retry</text>

<!-- Footer -->
<text class="footer" x="500" y="660" text-anchor="middle">Event-driven pipeline · async decoupling · stream processing · failure handling · completion notifications</text>
</svg>
