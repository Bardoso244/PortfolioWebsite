<rect x="476" y="95" width="148" height="158" rx="10" fill="#e0f5ef" stroke="#80cdb9" stroke-width="0.8"/>
<rect x="500" y="112" width="100" height="88" rx="8" fill="#00695c"/>
<ellipse cx="550" cy="134" rx="28" ry="9" fill="#fff" opacity="0.9"/>
<rect x="522" y="134" width="56" height="38" fill="#fff" opacity="0.75"/>
<ellipse cx="550" cy="172" rx="28" ry="9" fill="#fff" opacity="0.9"/>
<line x1="530" y1="148" x2="570" y2="148" stroke="#004d40" stroke-width="1.2" opacity="0.5"/>
<line x1="530" y1="160" x2="570" y2="160" stroke="#004d40" stroke-width="1.2" opacity="0.5"/>
