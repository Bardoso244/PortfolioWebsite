<circle cx="185" cy="334" r="6" fill="#fff" opacity="0.4"/>
<rect x="196" y="330" width="32" height="8" rx="3" fill="#fff" opacity="0.9"/>
<rect x="218" y="338" width="8" height="8" rx="2" fill="#fff" opacity="0.9"/>
<rect x="208" y="338" width="6" height="10" rx="2" fill="#fff" opacity="0.9"/>
<text class="th" x="195" y="398" text-anchor="middle">Key Vault</text>
<text class="ts" x="195" y="413" text-anchor="middle">Secrets</text>
<!-- NSGs card -->
<rect x="275" y="290" width="130" height="130" rx="10" fill="#fff8e1" stroke="#ffcc80" stroke-width="0.8"/>
<rect x="298" y="306" width="84" height="72" rx="8" fill="#e65100"/>
<path d="M340 314 L368 322 L368 344 Q368 362 340 370 Q312 362 312 344 L312 322 Z" fill="#fff" opacity="0.92"/>
<line x1="322" y1="334" x2="358" y2="334" stroke="#e65100" stroke-width="2" stroke-linecap="round"/>
<line x1="322" y1="342" x2="358" y2="342" stroke="#e65100" stroke-width="2" stroke-linecap="round"/>
<line x1="322" y1="350" x2="358" y2="350" stroke="#e65100" stroke-width="2" stroke-linecap="round"/>
<text class="th" x="340" y="398" text-anchor="middle">NSGs</text>
<text class="ts" x="340" y="413" text-anchor="middle">Traffic control</text>
<!-- Terraform card -->
<rect x="420" y="290" width="130" height="130" rx="10" fill="#ede7f6" stroke="#b39ddb" stroke-width="0.8"/>
<rect x="443" y="306" width="84" height="72" rx="8" fill="#4527a0"/>
<polygon points="485,318 463,358 485,346" fill="#fff" opacity="0.95"/>
<polygon points="485,318 507,358 485,346" fill="#fff" opacity="0.65"/>
<text class="th" x="485" y="398" text-anchor="middle">Terraform</text>
<text class="ts" x="485" y="413" text-anchor="middle">IaC deploy</text>
<text class="footer" x="340" y="503" text-anchor="middle">Azure equivalent of the AWS design · WAF-protected entry · private app tier · managed DB access</text>
</svg>
