<svg width="100%" viewBox="0 0 680 530" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Azure Terraform Architecture</title>
<desc>Architecture diagram showing App Gateway WAF, App Tier, Azure MySQL, Key Vault, NSGs, and Terraform inside an Azure VNet</desc>
<style>
  text { font-family: 'Segoe UI', Inter, Arial, sans-serif; }
  .th  { font-size:14px; font-weight:600; fill:#111111; }
  .ts  { font-size:12px; fill:#333333; }
  .title    { font-size:18px; font-weight:700; fill:#ffffff; }
  .subtitle { font-size:12px; fill:#aaaaaa; }
  .footer   { font-size:12px; fill:#aaaaaa; }
  .label    { font-size:11px; fill:#aaaaaa; }
</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="530" fill="#000000" rx="16"/>
<text class="title" x="40" y="36">Azure Terraform Architecture</text>
<text class="subtitle" x="40" y="56">Application Gateway + WAF · VNet · NSGs · Key Vault · Azure MySQL</text>
<rect x="20" y="70" width="640" height="440" rx="12" fill="none" stroke="#2a3a4a" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="30" y="62" width="42" height="16" rx="4" fill="#000000"/>
<text class="label" x="38" y="74">VNet</text>
<!-- App Gateway card -->
<rect x="48" y="95" width="148" height="158" rx="10" fill="#e3f0fd" stroke="#90c3f5" stroke-width="0.8"/>
<rect x="72" y="112" width="100" height="88" rx="8" fill="#1565c0"/>
<path d="M122 120 L150 130 L150 155 Q150 175 122 183 Q94 175 94 155 L94 130 Z" fill="#fff" opacity="0.92"/>
<path d="M108 152 L118 164 L138 140" fill="none" stroke="#1565c0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="th" x="122" y="218" text-anchor="middle">App Gateway</text>
<text class="ts" x="122" y="236" text-anchor="middle">WAF public tier</text>
<!-- Arrow HTTPS -->
<line x1="198" y1="174" x2="248" y2="174" stroke="#EF9F27" stroke-width="1.8" marker-end="url(#arr)"/>
<text class="subtitle" x="223" y="165" text-anchor="middle">HTTPS</text>
<!-- App Tier card -->
<rect x="262" y="95" width="148" height="158" rx="10" fill="#f0e8fc" stroke="#c89cf0" stroke-width="0.8"/>
<rect x="286" y="112" width="100" height="88" rx="8" fill="#6a1b9a"/>
<rect x="299" y="126" width="74" height="16" rx="4" fill="#fff" opacity="0.9"/>
<rect x="299" y="148" width="74" height="16" rx="4" fill="#fff" opacity="0.9"/>
<rect x="299" y="170" width="74" height="16" rx="4" fill="#fff" opacity="0.9"/>
<circle cx="309" cy="134" r="3" fill="#ce93d8"/>
<circle cx="309" cy="156" r="3" fill="#ce93d8"/>
<circle cx="309" cy="178" r="3" fill="#ce93d8"/>
