<text class="ts" x="336" y="236" text-anchor="middle">Private subnet</text>
<!-- Arrow Private -->
<line x1="412" y1="174" x2="462" y2="174" stroke="#EF9F27" stroke-width="1.8" marker-end="url(#arr)"/>
