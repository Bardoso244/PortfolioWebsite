<text class="ts" x="550" y="236" text-anchor="middle">DB subnet</text>
<!-- Key Vault card -->
<rect x="130" y="290" width="130" height="130" rx="10" fill="#fdecea" stroke="#f5a8a5" stroke-width="0.8"/>
